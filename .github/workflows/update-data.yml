name: Update Renters Data Every 12 Hours

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: '0 0,12 * * *'
  # Allows you to trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data-and-deploy:
    runs-on: ubuntu-latest
    
    # We need permission to push the updated CSV back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Verify Wrangler installation
        run: npx wrangler --version

      - name: Fetch CSV from Google Sheets
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1cRmN8s2aYvgFYztTH2QC4zm9IxjtAl9FgABQMD0R1Kw/export?format=csv&gid=0" -o renters_raw.csv
          echo "✓ Downloaded renters_raw.csv"
          ls -lh renters_raw.csv
          # Clean up the malformed CSV export from Google Sheets
          node scripts/clean-csv.js
          echo "✓ Cleaned CSV file"
          ls -lh renters.csv
          head -5 renters.csv

      - name: Update stats in data.js
        run: |
          echo "=== CSV File Check ==="
          echo "renters.csv exists: $(test -f renters.csv && echo 'yes' || echo 'no')"
          echo "renters_raw.csv exists: $(test -f renters_raw.csv && echo 'yes' || echo 'no')"
          if [ -f renters.csv ]; then
            echo "renters.csv line count: $(wc -l < renters.csv)"
            echo "First 3 lines:"
            head -3 renters.csv
          fi
          echo ""
          echo "=== Running update-stats.js ==="
          node update-stats.js
          echo ""
          echo "=== Checking updated data.js ==="
          echo "data.js file size: $(wc -c < js/data.js)"

      - name: Commit and Push changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Auto-update: Sync renters data from Google Sheets"
          file_pattern: "renters.csv js/data.js"
          
      - name: Deploy to Cloudflare
        if: steps.auto-commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
