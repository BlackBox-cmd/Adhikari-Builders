          commit_message: "Auto-update: Sync renters data from Google Sheets"
          file_pattern: "renters.csv js/data.js"
          
      - name: Deploy to Cloudflare
        if: steps.auto-commit.outputs.changes_detected == 'true' || github.event_name == 'workflow_dispatch'
